<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Symphony</title>

<!-- 外部函式庫（需要網路）：Chart.js 畫圖、Tone.js 做音樂 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>

<style>
  /* ===== 外觀設定：只影響長相 ===== */
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #e8e8e8;
         max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: #9aa0a6; margin-top: 0; }
  .chart-box { background: #171a21; border-radius: 12px; padding: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; }
  button { background: #2b6cff; color: white; border: none; border-radius: 8px;
           padding: 10px 18px; font-size: 16px; cursor: pointer; }
  button:disabled { background: #444; cursor: default; }
  .info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card { background: #171a21; border-radius: 10px; padding: 10px 12px; color: #9aa0a6; font-size: 13px; }
  .card b { display: block; color: #e8e8e8; font-size: 20px; margin-top: 4px; }
  .meter { height: 10px; background: #2a2e36; border-radius: 5px; overflow: hidden; margin-top: 16px; }
  .meter div { height: 100%; width: 0%; background: #3ecf8e; transition: width 0.2s, background 0.2s; }
</style>
</head>

<body>
  <h1>Market Symphony</h1>
  <p class="subtitle">Hear the market: the soundtrack changes key, mood and tempo with FX prices</p>

  <div class="chart-box"><canvas id="chart" height="120"></canvas></div>

  <div class="controls">
    <button id="playBtn">▶ Play</button>
    <button id="stopBtn" disabled>■ Stop</button>
    <label>Load CSV <input id="fileInput" type="file" accept=".csv"></label>
  </div>

  <div class="info">
    <div class="card">Price<b id="priceText">-</b></div>
    <div class="card">Key<b id="keyText">-</b></div>
    <div class="card">Tempo<b id="bpmText">-</b></div>
    <div class="card">Storm<b id="stormText">-</b></div>
  </div>
  <div class="meter"><div id="meterBar"></div></div>

<script>
// =====================================================================
// 第二版：循環播放的遊戲 BGM，跟著市場「轉調、換情緒、變速」
//
// 規則（作品的靈魂）：
//   價格趨勢  → 大調 / 小調   上漲 = 明亮的大調，下跌 = 陰暗的小調
//   價格高低  → 轉調          價格越高，整首歌的調越高
//   波動大小  → 速度和激烈程度  越劇烈 = 越快、鼓越密、聲音越破、出現不和諧音
// 轉調和換情緒只在「每一小節的開頭」發生，所以聽起來是順順地轉，不會亂掉。
// =====================================================================

// ---------- 1. 資料 ----------
let prices = [];

// 假資料：前段平穩微漲、中段開始下跌、後段暴跌（模擬市場風暴）
function makeFakeData() {
  const data = [];
  let price = 1.30;
  for (let i = 0; i < 256; i++) {
    let size = 0.0015, drift = 0.0002;               // 平穩
    if (i > 110) { size = 0.004; drift = -0.0008; }  // 開始緊張
    if (i > 170) { size = 0.012; drift = -0.003; }   // 風暴
    price += drift + (Math.random() - 0.5) * size;
    data.push(Number(price.toFixed(4)));
  }
  return data;
}

// 讀 CSV：每一行抓「最後一個是數字的欄位」當價格
function parseCsv(text) {
  const result = [];
  for (const line of text.split(/\r?\n/)) {
    const cells = line.split(',');
    for (let i = cells.length - 1; i >= 0; i--) {
      const v = parseFloat(cells[i]);
      if (!isNaN(v)) { result.push(v); break; }
    }
  }
  return result;
}

// ---------- 2. 事先算好每個時間點的「市場狀態」 ----------
// level：價格在最低～最高之間的位置（0～1）
// trend：最近 16 筆的漲跌（正 = 漲，負 = 跌）
// storm：最近 10 筆的波動有多大，換算成 0～1（1 = 整段資料裡最劇烈的時候）
let level = [], trend = [], storm = [];

function analyse() {
  const min = Math.min(...prices), max = Math.max(...prices);
  level = prices.map(p => (p - min) / (max - min || 1));
  trend = prices.map((p, i) => p - prices[Math.max(0, i - 16)]);

  const changes = prices.map((p, i) => (i === 0 ? 0 : Math.abs(p - prices[i - 1])));
  const raw = changes.map((_, i) => {
    const recent = changes.slice(Math.max(0, i - 9), i + 1);
    return recent.reduce((a, b) => a + b, 0) / recent.length;
  });
  const top = Math.max(...raw) || 1;
  storm = raw.map(v => v / top);
}

// ---------- 3. 畫圖 ----------
const chart = new Chart(document.getElementById('chart'), {
  type: 'line',
  data: { labels: [], datasets: [
    { data: [], borderColor: '#4f8cff', pointRadius: 0, borderWidth: 2 },
    { data: [], borderColor: '#ff7a45', backgroundColor: '#ff7a45', pointRadius: 6, showLine: false }
  ]},
  options: { animation: false, plugins: { legend: { display: false } },
    scales: { x: { display: false }, y: { ticks: { color: '#9aa0a6' }, grid: { color: '#2a2e36' } } } }
});

function drawChart() {
  chart.data.labels = prices.map((_, i) => i);
  chart.data.datasets[0].data = prices;
  chart.data.datasets[1].data = prices.map(() => null);
  chart.update();
}

// ---------- 4. 樂器（遊戲機風格） ----------
// 破音效果：平常幾乎關掉，風暴時開大
const distortion = new Tone.Distortion(0.6).toDestination();
distortion.wet.value = 0;

// 主旋律：方波 = 經典 8-bit 遊戲音色
const lead = new Tone.Synth({ oscillator: { type: 'square' },
  envelope: { attack: 0.005, decay: 0.1, sustain: 0.2, release: 0.1 } }).connect(distortion);
lead.volume.value = -14;

// 低音
const bass = new Tone.Synth({ oscillator: { type: 'triangle' },
  envelope: { attack: 0.01, decay: 0.2, sustain: 0.5, release: 0.2 } }).toDestination();
bass.volume.value = -8;

// 鼓：大鼓、小鼓、鈸
const kick = new Tone.MembraneSynth().toDestination();
kick.volume.value = -6;
const snare = new Tone.NoiseSynth({ envelope: { attack: 0.001, decay: 0.15, sustain: 0 } }).toDestination();
snare.volume.value = -16;
const hat = new Tone.NoiseSynth({ envelope: { attack: 0.001, decay: 0.03, sustain: 0 } }).toDestination();
hat.volume.value = -26;

// ---------- 5. 樂理：調、和弦 ----------
const MAJOR = [0, 2, 4, 5, 7, 9, 11];   // 大調音階（明亮）
const MINOR = [0, 2, 3, 5, 7, 8, 10];   // 小調音階（陰暗）
// 和弦進行（用音階的第幾個音當根音）
const PROGRESSION = { major: [0, 4, 5, 3],   // I – V – vi – IV，超多流行歌在用
                      minor: [0, 5, 2, 6] }; // i – VI – III – VII，很有戰鬥感
const NOTE_NAMES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];

// 目前的音樂狀態（只在小節開頭更新）
let key = 0;          // 轉調：比 C 高幾個半音
let mode = 'major';   // 'major' 或 'minor'
let chordIndex = 0;   // 現在彈和弦進行裡的第幾個和弦

// 拿到目前和弦的三個音（MIDI 編號，60 = 中央 C）
function currentChord() {
  const scale = mode === 'major' ? MAJOR : MINOR;
  const root = PROGRESSION[mode][chordIndex];
  return [0, 2, 4].map(offset => {
    const degree = root + offset;
    return 60 + key + scale[degree % 7] + 12 * Math.floor(degree / 7);
  });
}

const midi = n => Tone.Frequency(n, 'midi').toNote();   // MIDI 編號 → 音名，例如 64 → "E4"

// ---------- 6. 播放：每個 16 分音符執行一次 ----------
let step = 0;   // 播到第幾筆資料（每個 16 分音符前進一筆）
let tick = 0;   // 這一小節的第幾個 16 分音符（0～15）
const ARP = [0, 1, 2, 1, 0, 1, 2, 3, 0, 1, 2, 1, 2, 3, 2, 1];  // 琶音的音符順序

function onTick(time) {
  if (step >= prices.length) { Tone.Draw.schedule(stop, time); return; }
  const s = storm[step];

  // --- 小節開頭：決定新的調、大小調、速度 ---
  if (tick === 0) {
    mode = trend[step] >= 0 ? 'major' : 'minor';
    key = Math.round(level[step] * 6) - 3;                 // -3 ～ +3 個半音
    chordIndex = (chordIndex + 1) % 4;
    Tone.Transport.bpm.rampTo(100 + s * 70, 0.5);          // 100 ～ 170 BPM
    distortion.wet.rampTo(s > 0.5 ? (s - 0.5) * 1.6 : 0, 0.5);
  }
  // 每兩拍換一次和弦，聽起來比較有變化
  if (tick === 8) chordIndex = (chordIndex + 1) % 4;

  const chord = currentChord();
  const notes = [...chord, chord[0] + 12];                  // 三個音 + 高八度的根音

  // --- 主旋律：琶音 ---
  let note = notes[ARP[tick]] + 12;
  if (s > 0.7 && Math.random() < s - 0.5) note += 6;       // 風暴時偶爾冒出刺耳的增四度
  lead.triggerAttackRelease(midi(note), '16n', time);

  // --- 低音：每拍一下 ---
  if (tick % 4 === 0) bass.triggerAttackRelease(midi(chord[0] - 24), '8n', time);

  // --- 鼓：越劇烈越密 ---
  if (tick % 4 === 0) kick.triggerAttackRelease('C1', '8n', time);
  if (s > 0.35 && (tick === 4 || tick === 12)) snare.triggerAttackRelease('16n', time);
  if (s > 0.75 && tick % 2 === 1) kick.triggerAttackRelease('C1', '16n', time);
  if (tick % 2 === 0 || s > 0.5) hat.triggerAttackRelease('32n', time);

  // --- 更新畫面（Tone.Draw 讓畫面和聲音同步） ---
  const i = step;
  Tone.Draw.schedule(() => updateScreen(i), time);

  step++;
  tick = (tick + 1) % 16;
}

function updateScreen(i) {
  const marker = prices.map(() => null);
  marker[i] = prices[i];
  chart.data.datasets[1].data = marker;
  chart.update();

  const s = storm[i];
  document.getElementById('priceText').textContent = prices[i].toFixed(4);
  document.getElementById('keyText').textContent =
    NOTE_NAMES[(key + 12) % 12] + (mode === 'major' ? ' major' : ' minor');
  document.getElementById('bpmText').textContent = Math.round(Tone.Transport.bpm.value) + ' bpm';
  document.getElementById('stormText').textContent =
    s > 0.7 ? 'Storm' : s > 0.35 ? 'Choppy' : 'Calm';
  const bar = document.getElementById('meterBar');
  bar.style.width = Math.round(s * 100) + '%';
  bar.style.background = s > 0.7 ? '#ff4d4f' : s > 0.35 ? '#faad14' : '#3ecf8e';
}

// ---------- 7. 按鈕 ----------
let loopId = null;

async function play() {
  await Tone.start();                       // 瀏覽器規定要使用者按下按鈕才能發聲
  if (step >= prices.length) step = 0;
  tick = 0;
  Tone.Transport.bpm.value = 100;
  loopId = Tone.Transport.scheduleRepeat(onTick, '16n');
  Tone.Transport.start();
  document.getElementById('playBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
}

function stop() {
  Tone.Transport.stop();
  if (loopId !== null) { Tone.Transport.clear(loopId); loopId = null; }
  document.getElementById('playBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
}

document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('stopBtn').addEventListener('click', stop);

document.getElementById('fileInput').addEventListener('change', async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const loaded = parseCsv(await file.text());
  if (loaded.length < 20) { alert('Could not find enough prices in this CSV'); return; }
  stop();
  prices = loaded;
  step = 0;
  analyse();
  drawChart();
});

// 一打開網頁就載入假資料
prices = makeFakeData();
analyse();
drawChart();
</script>
</body>
</html>
