<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Symphony</title>

<!-- 外部函式庫（需要網路）：Chart.js 畫圖、Tone.js 做音樂 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<!-- SGX FX 的真實資料（和 index.html 放在同一個資料夾） -->
<script src="data.js"></script>

<style>
  /* ===== 外觀設定：只影響長相 ===== */
  body { font-family: system-ui, sans-serif; background: #0f1115; transition: background 1.5s; color: #e8e8e8;
         max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: #9aa0a6; margin-top: 0; }
  .chart-box { background: #171a21; border-radius: 12px; padding: 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; }
  button { background: #2b6cff; color: white; border: none; border-radius: 8px;
           padding: 10px 18px; font-size: 16px; cursor: pointer; }
  button:disabled { background: #444; cursor: default; }
  .info { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  select { font-size: 15px; padding: 8px; border-radius: 8px; background: #171a21; color: #e8e8e8; border: 1px solid #333; }
  .card { background: #171a21; border-radius: 10px; padding: 10px 12px; color: #9aa0a6; font-size: 13px; }
  .card b { display: block; color: #e8e8e8; font-size: 20px; margin-top: 4px; }
  .meter { height: 10px; background: #2a2e36; border-radius: 5px; overflow: hidden; margin-top: 16px; }
  .meter div { height: 100%; width: 0%; background: #3ecf8e; transition: width 0.2s, background 0.2s; }
</style>
</head>

<body>
  <h1>Market Symphony</h1>
  <p class="subtitle">Hear the market: rising prices sound like heaven, falling prices sound like a horror film</p>

  <div class="chart-box"><canvas id="chart" height="120"></canvas></div>

  <div class="controls">
    <button id="playBtn">▶ Play</button>
    <button id="stopBtn" disabled>■ Stop</button>
    <button id="restartBtn">↺ Restart</button>
    <select id="datasetSelect"></select>
    <select id="viewSelect">
      <option value="storm">Zoom: biggest storm</option>
      <option value="day">Whole day</option>
    </select>
    <select id="speedSelect">
      <option value="4">Speed: very slow</option>
      <option value="2" selected>Speed: slow</option>
      <option value="1">Speed: fast</option>
    </select>
    <label>Volume <input id="volume" type="range" min="-30" max="6" value="0"></label>
    <label>Load CSV <input id="fileInput" type="file" accept=".csv"></label>
  </div>

  <div class="info">
    <div class="card">Time<b id="timeText">-</b></div>
    <div class="card">Price<b id="priceText">-</b></div>
    <div class="card">Mood<b id="keyText">-</b></div>
    <div class="card">Tempo<b id="bpmText">-</b></div>
    <div class="card">Storm<b id="stormText">-</b></div>
  </div>
  <div class="meter"><div id="meterBar"></div></div>

<script>
// =====================================================================
// Market Symphony：把匯率變成配樂
//
//   上漲 → 天堂：明亮的合唱長音 + 往上爬的鈴聲，漲越久調越高、鈴聲越密
//   平穩 → 平靜：輕輕的和弦和零星的旋律
//   下跌 → 恐怖：低沉的魔鬼音程 + 顫抖的詭異高音 + 心跳，跌越久越破音、心跳越快
//   波動大 → 不管漲跌，都加快速度並加上急促的鈸聲
// =====================================================================

// ---------- 1. 資料 ----------
// 一份資料 = { t: 時間, c: 收盤價, h: 最高價, l: 最低價 }，每個都是一串數字（陣列）
// full 是整份資料；prices / ranges / times 是「現在要播放的那一段」
let full = null;
let prices = [], ranges = [], times = [];

// 假資料：前段平穩、中段下跌、後段暴跌（沒有真實資料時用）
function makeFakeData() {
  const d = { t: [], c: [], h: [], l: [] };
  let price = 1.30;
  for (let i = 0; i < 256; i++) {
    let size = 0.0015, drift = 0.0002;
    if (i > 110) { size = 0.004; drift = -0.0008; }
    if (i > 170) { size = 0.012; drift = -0.003; }
    const prev = price;
    price += drift + (Math.random() - 0.5) * size;
    d.t.push('step ' + i);
    d.c.push(price);
    d.h.push(Math.max(prev, price));
    d.l.push(Math.min(prev, price));
  }
  return d;
}

// 讀 CSV。如果有 SGX FX 格式的欄位（close_mid 等）就用它們；
// 否則每一行抓「最後一個是數字的欄位」當價格。
function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines[0].split(',');
  const col = name => header.indexOf(name);
  const d = { t: [], c: [], h: [], l: [] };

  if (col('close_mid') >= 0) {
    for (const line of lines.slice(1)) {
      const x = line.split(',');
      d.t.push((x[col('timestamp')] || '').slice(11, 16));
      d.c.push(parseFloat(x[col('close_mid')]));
      d.h.push(parseFloat(x[col('high_mid')]));
      d.l.push(parseFloat(x[col('low_mid')]));
    }
  } else {
    lines.forEach((line, i) => {
      const cells = line.split(',');
      for (let k = cells.length - 1; k >= 0; k--) {
        const v = parseFloat(cells[k]);
        if (!isNaN(v)) { d.t.push('row ' + i); d.c.push(v); d.h.push(v); d.l.push(v); break; }
      }
    });
  }
  return d;
}

// 從整份資料裡選出要播放的那一段
//  "storm"：找出一分鐘內振幅最大的時刻，取它前 90 分鐘、後 60 分鐘（約 2.5 分鐘的音樂）
//  "day"：整天壓縮成約 240 步（每一步合併好幾分鐘）
function selectView() {
  const view = document.getElementById('viewSelect').value;
  const n = full.c.length;
  prices = []; ranges = []; times = [];

  if (view === 'storm') {
    let peak = 0;
    for (let i = 0; i < n; i++) {
      if (full.h[i] - full.l[i] > full.h[peak] - full.l[peak]) peak = i;
    }
    const start = Math.max(0, peak - 90), end = Math.min(n, peak + 60);
    for (let i = start; i < end; i++) {
      prices.push(full.c[i]); ranges.push(full.h[i] - full.l[i]); times.push(full.t[i]);
    }
  } else {
    const size = Math.max(1, Math.ceil(n / 240));    // 每一步合併幾分鐘
    for (let i = 0; i < n; i += size) {
      const end = Math.min(n, i + size);
      const hi = Math.max(...full.h.slice(i, end)), lo = Math.min(...full.l.slice(i, end));
      prices.push(full.c[end - 1]); ranges.push(hi - lo); times.push(full.t[i]);
    }
  }
}

// 換一份資料：選出要播的那一段 → 分析 → 畫圖
function loadData(d) {
  stop();
  full = d;
  selectView();
  step = 0;
  analyse();
  drawChart();
}

// ---------- 2. 事先算好每個時間點的「市場狀態」 ----------
// mood：這個時間點的情緒
//   'heaven' = 持續上漲         → 天堂般的音樂
//   'horror' = 持續下跌         → 恐怖片般的音樂
//   'calm'   = 在一個區間裡晃   → 平靜的音樂
// intensity：情緒有多強烈（0～1）。漲/跌得越多、而且持續越久，數字越大，音效就越深。
// storm：最近幾筆的「振幅」（最高價 - 最低價）有多大（0～1），用來加鼓和加快速度。
let moods = [], intensity = [], storm = [];

function analyse() {
  // --- 情緒：看「最近 12 步」是不是一路往同一個方向走 ---
  // 「方向一致度」= 淨漲跌 ÷ 這段路上所有上下跳動加起來的總距離
  //   一路穩穩往下走 → 接近 -1；一路往上 → 接近 +1；上上下下原地打轉 → 接近 0
  // 這樣「慢慢但持續地下跌」也能很快被抓到，不會被當成平穩。
  const W = 12;
  const netMoves = prices.map((p, i) => Math.abs(p - prices[Math.max(0, i - W)])).sort((a, b) => a - b);
  const BAND = netMoves[Math.floor(netMoves.length / 2)] || 1e-9;  // 12 步之間「一般」會走多遠
  const ENTER = 0.35;   // 一致度超過這個值，才算開始漲/跌
  const LEAVE = 0.15;   // 漲/跌中，一致度掉到這個值以下，才算結束（兩個門檻不同，避免一直來回切換）
  const CONFIRM = 3;    // 新的情緒要連續出現 3 步才切換（大暴衝例外，立刻切換）

  moods = []; intensity = [];
  let state = 'calm', pending = 0, startIndex = 0;

  prices.forEach((p, i) => {
    // 視窗「以現在為中心」：往前看 6 步、往後看 6 步。
    // 因為播的是歷史資料，未來幾步其實已經知道了，這樣音樂就能在趨勢「剛開始」時就切換，不會慢半拍。
    const from = Math.max(0, i - W / 2), to = Math.min(prices.length - 1, i + W / 2);
    const net = prices[to] - prices[from];
    let path = 0;
    for (let k = from + 1; k <= to; k++) path += Math.abs(prices[k] - prices[k - 1]);
    const consistency = path ? net / path : 0;

    // 這一步「想要」變成什麼情緒
    let want = 'calm';
    if (consistency > ENTER && net > 0.5 * BAND) want = 'heaven';
    else if (consistency < -ENTER && -net > 0.5 * BAND) want = 'horror';
    else if (state === 'heaven' && consistency > LEAVE) want = 'heaven';   // 還在漲，維持
    else if (state === 'horror' && consistency < -LEAVE) want = 'horror';  // 還在跌，維持

    // 要連續好幾步都想換，才真的換；如果是很大的暴衝（超過一般的 2 倍），立刻換
    if (want !== state) {
      pending++;
      if (pending >= CONFIRM || Math.abs(net) > 2 * BAND) {
        state = want; pending = 0; startIndex = i;
      }
    } else pending = 0;

    moods.push(state);
    if (state === 'calm') intensity.push(0);
    else {
      const distance = Math.min(1, Math.abs(net) / (3 * BAND));      // 漲/跌了多少
      const duration = Math.min(1, (i - startIndex) / 40);            // 持續多久
      intensity.push(0.6 * distance + 0.4 * duration);
    }
  });
  // 「連續 3 步才切換」會讓切換晚 3 步，這裡把結果整體往前挪 3 步抵消掉
  moods = moods.slice(CONFIRM).concat(Array(CONFIRM).fill(moods[moods.length - 1]));
  intensity = intensity.slice(CONFIRM).concat(Array(CONFIRM).fill(intensity[intensity.length - 1]));

  // --- 風暴：振幅。有最高/最低價就用它，否則用前後兩筆的價差 ---
  const changes = prices.map((p, i) =>
    Math.max(ranges[i] || 0, i === 0 ? 0 : Math.abs(p - prices[i - 1])));
  const raw = changes.map((_, i) => {
    const recent = changes.slice(Math.max(0, i - 9), i + 1);
    return recent.reduce((a, b) => a + b, 0) / recent.length;
  });
  const top = Math.max(...raw) || 1;
  // 以「中位數」當作平靜，最劇烈的時候當作 1；開 0.6 次方讓中等波動也聽得出來
  const median = [...raw].sort((a, b) => a - b)[Math.floor(raw.length / 2)];
  storm = raw.map(v => Math.pow(Math.max(0, (v - median) / (top - median || 1)), 0.6));
}

// ---------- 3. 畫圖 ----------
const MOOD_COLORS = { heaven: '#f5c542', horror: '#ff4d4f', calm: '#8a93a6' };
const chart = new Chart(document.getElementById('chart'), {
  type: 'line',
  data: { labels: [], datasets: [
    // 價格線：每一段依照情緒上色（天堂 = 金色、恐怖 = 紅色、平穩 = 灰藍色）
    { data: [], borderColor: '#8a93a6', pointRadius: 0, borderWidth: 2.5,
      segment: { borderColor: ctx => MOOD_COLORS[moods[ctx.p0DataIndex]] || '#8a93a6' } },
    { data: [], borderColor: '#ff7a45', backgroundColor: '#ff7a45', pointRadius: 6, showLine: false }
  ]},
  options: { animation: false, plugins: { legend: { display: false } },
    scales: { x: { display: false }, y: { ticks: { color: '#9aa0a6' }, grid: { color: '#2a2e36' } } } }
});

function drawChart() {
  chart.data.labels = times;
  chart.data.datasets[0].data = prices;
  chart.data.datasets[1].data = prices.map(() => null);
  chart.update();
}

// ---------- 4. 樂器 ----------
// 殘響：讓聲音像在大教堂或空曠的地方，天堂和恐怖都需要它
const reverb = new Tone.Reverb({ decay: 5, wet: 0.45 }).toDestination();

// 天堂：柔和的長音和弦（像合唱）+ 高音的鈴聲
const pad = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'sine' },
  envelope: { attack: 0.6, decay: 0.3, sustain: 0.8, release: 2 } }).connect(reverb);
pad.volume.value = -14;
const bell = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'triangle' },
  envelope: { attack: 0.005, decay: 0.6, sustain: 0, release: 1.2 } }).connect(reverb);
bell.volume.value = -16;

// 平靜：輕輕的單音旋律
const soft = new Tone.Synth({ oscillator: { type: 'triangle' },
  envelope: { attack: 0.02, decay: 0.8, sustain: 0, release: 1 } }).connect(reverb);
soft.volume.value = -14;

// 恐怖：低沉的嗡嗡聲（越恐怖越破音）+ 會顫抖的詭異高音 + 心跳
const horrorDistortion = new Tone.Distortion(0.5).connect(reverb);
horrorDistortion.wet.value = 0;
const droneFilter = new Tone.Filter(500, 'lowpass').connect(horrorDistortion);
const drone = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'sawtooth' },
  envelope: { attack: 1, decay: 0.5, sustain: 0.9, release: 2 } }).connect(droneFilter);
drone.volume.value = -16;
const vibrato = new Tone.Vibrato(6, 0.5).connect(reverb);
const eerie = new Tone.Synth({ oscillator: { type: 'sine' },
  envelope: { attack: 0.4, decay: 0.5, sustain: 0.6, release: 1.5 } }).connect(vibrato);
eerie.volume.value = -18;
const heart = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4 }).toDestination();
heart.volume.value = -4;

// 波動大的時候加進來的鈸
const hat = new Tone.NoiseSynth({ envelope: { attack: 0.001, decay: 0.03, sustain: 0 } }).toDestination();
hat.volume.value = -28;

// ---------- 5. 樂理 ----------
const MAJOR = [0, 2, 4, 5, 7, 9, 11];
const HEAVEN_PROGRESSION = [0, 3, 5, 4];   // I – IV – vi – V：溫暖、往上走的感覺
const CALM_PROGRESSION = [0, 5, 3, 4];     // I – vi – IV – V：最常見、最安心的進行
const PENTATONIC = [0, 2, 4, 7, 9];        // 平靜旋律用的五聲音階

// 用大調音階做出一個三和弦（三個 MIDI 音高，60 = 中央 C）
function chordAt(root, base) {
  return [0, 2, 4].map(offset => {
    const degree = root + offset;
    return base + MAJOR[degree % 7] + 12 * Math.floor(degree / 7);
  });
}
const midi = n => Tone.Frequency(n, 'midi').toNote();   // MIDI 編號 → 音名，例如 64 → "E4"

// ---------- 6. 播放：每個 16 分音符執行一次（一小節 = 16 次） ----------
let step = 0;          // 播到第幾筆資料
let tick = 0;          // 這一小節的第幾個 16 分音符（0～15）
let bar = 0;           // 第幾小節
let mood = 'calm', power = 0, wind = 0;   // 這一小節的情緒、強度、風暴程度
let chord = [60, 64, 67];                 // 這一小節的和弦

function onTick(time) {
  if (step >= prices.length) { Tone.Draw.schedule(stop, time); return; }

  // ===== 決定情緒，並彈出長音 =====
  // 每一小節的開頭會重新彈一次；如果情緒在小節中間變了，就在下一拍（最多等 3 步）立刻切換，
  // 這樣音樂不會慢半拍，但也不會在拍子中間亂切
  const moodChanged = moods[step] !== mood;
  if (tick === 0 || (tick % 4 === 0 && moodChanged)) {
    if (moodChanged) { pad.releaseAll(time); drone.releaseAll(time); }
    mood = moods[step]; power = intensity[step]; wind = storm[step];
    if (tick === 0) bar++;

    const bpm = mood === 'heaven' ? 88 + 30 * power
              : mood === 'horror' ? 66 + 50 * power
              : 76;
    Tone.Transport.bpm.rampTo(bpm + wind * 30, 1);
    horrorDistortion.wet.rampTo(mood === 'horror' ? power * 0.8 : 0, 1);

    if (mood === 'heaven') {
      // 越強烈，整首歌的調就越往上升（最多升 5 個半音），像一路飛上天
      chord = chordAt(HEAVEN_PROGRESSION[bar % 4], 60 + Math.round(power * 5));
      pad.triggerAttackRelease(chord.map(midi), '1m', time, 0.5 + 0.5 * power);
    } else if (mood === 'horror') {
      // 低音 C + F#：「增四度」，又叫「魔鬼音程」，聽起來很不安
      const notes = [36, 42];
      if (power > 0.5) notes.push(37);    // 再加一個只差半音的音，更刺耳
      drone.triggerAttackRelease(notes.map(midi), '1m', time, 0.6 + 0.4 * power);
    } else {
      chord = chordAt(CALM_PROGRESSION[bar % 4], 55);
      pad.triggerAttackRelease(chord.map(midi), '1m', time, 0.3);
    }
  }

  // ===== 每個 16 分音符 =====
  if (mood === 'heaven') {
    // 往上爬的鈴聲琶音；越強烈越密、越高
    const every = power > 0.6 ? 1 : 2;
    if (tick % every === 0) {
      const ladder = [...chord, ...chord.map(n => n + 12)];
      const note = ladder[(tick / every) % ladder.length] + 12 + 12 * Math.round(power);
      bell.triggerAttackRelease(midi(note), '8n', time, 0.6);
    }
    // 偶爾閃一下更高的音，像星星
    if (Math.random() < power * 0.25) bell.triggerAttackRelease(midi(chord[2] + 36), '16n', time, 0.4);
  } else if (mood === 'horror') {
    // 心跳「咚—咚」，越恐怖跳越快
    const beats = power > 0.75 ? [0, 2, 4, 6, 8, 10, 12, 14] : power > 0.4 ? [0, 2, 8, 10] : [0, 2];
    if (beats.includes(tick)) heart.triggerAttackRelease(tick % 4 === 0 ? 'C1' : 'A0', '8n', time);
    // 詭異的高音，會顫抖，越恐怖越常出現
    if ((tick === 4 || tick === 12) && Math.random() < 0.3 + 0.6 * power) {
      const scary = [73, 78, 83][Math.floor(Math.random() * 3)];
      eerie.triggerAttackRelease(midi(scary), '2n', time);
    }
  } else {
    // 平靜：慢慢地、隨意地彈幾個五聲音階的音
    if (tick % 4 === 0 && Math.random() < 0.6) {
      const note = 67 + PENTATONIC[Math.floor(Math.random() * PENTATONIC.length)];
      soft.triggerAttackRelease(midi(note), '4n', time, 0.5);
    }
  }

  // 波動很大時，不管什麼情緒都加上急促的鈸聲
  if ((wind > 0.45 && tick % 2 === 0) || wind > 0.75) hat.triggerAttackRelease('32n', time);

  // 更新畫面（Tone.Draw 讓畫面和聲音同步）
  const i = step;
  Tone.Draw.schedule(() => updateScreen(i), time);

  // 每隔幾個 16 分音符才前進一筆資料（越大，橘點走得越慢）
  const every = Number(document.getElementById('speedSelect').value);
  if (tick % every === every - 1) step++;
  tick = (tick + 1) % 16;
}

const MOOD_STYLE = {
  heaven: { label: 'Heaven', color: '#f5c542', background: '#1c1a10' },
  horror: { label: 'Horror', color: '#ff4d4f', background: '#1c0d10' },
  calm:   { label: 'Calm',   color: '#3ecf8e', background: '#0f1115' }
};

function updateScreen(i) {
  const marker = prices.map(() => null);
  marker[i] = prices[i];
  chart.data.datasets[1].data = marker;
  chart.update();

  const style = MOOD_STYLE[moods[i]];
  document.body.style.background = style.background;     // 背景顏色跟著情緒變
  const moodText = document.getElementById('keyText');
  moodText.textContent = style.label + (moods[i] === 'calm' ? '' : ' ' + Math.round(intensity[i] * 100) + '%');
  moodText.style.color = style.color;

  const s = storm[i];
  document.getElementById('timeText').textContent = times[i];
  document.getElementById('priceText').textContent = prices[i].toFixed(5);
  document.getElementById('bpmText').textContent = Math.round(Tone.Transport.bpm.value) + ' bpm';
  document.getElementById('stormText').textContent = s > 0.7 ? 'Storm' : s > 0.35 ? 'Choppy' : 'Calm';
  const meter = document.getElementById('meterBar');
  meter.style.width = Math.round(s * 100) + '%';
  meter.style.background = s > 0.7 ? '#ff4d4f' : s > 0.35 ? '#faad14' : '#3ecf8e';
}

// ---------- 7. 按鈕 ----------
let loopId = null;

async function play() {
  await Tone.start();                       // 瀏覽器規定要使用者按下按鈕才能發聲
  if (step >= prices.length) step = 0;
  tick = 0;
  Tone.Transport.bpm.value = 76;
  loopId = Tone.Transport.scheduleRepeat(onTick, '16n');
  Tone.Transport.start();
  document.getElementById('playBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
}

function stop() {
  Tone.Transport.stop();
  if (loopId !== null) { Tone.Transport.clear(loopId); loopId = null; }
  document.getElementById('playBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
}

document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('stopBtn').addEventListener('click', stop);
// 從頭開始播
document.getElementById('restartBtn').addEventListener('click', () => { stop(); step = 0; play(); });
// 音量（單位是分貝，0 = 原本的音量）
document.getElementById('volume').addEventListener('input', e => {
  Tone.Destination.volume.value = Number(e.target.value);
});

document.getElementById('fileInput').addEventListener('change', async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const loaded = parseCsv(await file.text());
  if (loaded.c.length < 20) { alert('Could not find enough prices in this CSV'); return; }
  datasets[file.name] = loaded;
  addOption(file.name);
  document.getElementById('datasetSelect').value = file.name;
  loadData(loaded);
});

// ---------- 8. 資料選單 ----------
// 內建的資料：data.js 裡 SGX FX 的真實資料 + 一份假資料
const datasets = {};
if (typeof MARKET_DATA !== 'undefined') Object.assign(datasets, MARKET_DATA);
datasets['Demo (fake storm)'] = makeFakeData();

function addOption(name) {
  const option = document.createElement('option');
  option.value = name;
  option.textContent = name;
  document.getElementById('datasetSelect').appendChild(option);
}
Object.keys(datasets).forEach(addOption);

document.getElementById('datasetSelect').addEventListener('change', e => loadData(datasets[e.target.value]));
document.getElementById('viewSelect').addEventListener('change', () => loadData(full));

// 一打開網頁就載入第一份資料
loadData(datasets[Object.keys(datasets)[0]]);
</script>
